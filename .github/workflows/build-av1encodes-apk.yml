name: Build AV1Encodes APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/en/av1encodes/**"
      - ".github/workflows/build-av1encodes-apk.yml"
      - "gradle/build-logic/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

jobs:
  build:
    name: Build AV1Encodes release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build AV1Encodes
        run: ./gradlew :src:en:av1encodes:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: av1encodes-release-apk
          path: src/en/av1encodes/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
