name: Build AllAnime APK

    on:
    push:
      branches: [master]
      paths:
        - 'src/en/allanime/**'
    workflow_dispatch:

    permissions:
    contents: read

    jobs:
    build:
      name: Build AllAnime
      runs-on: ubuntu-latest
      timeout-minutes: 30

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Java 17
          uses: actions/setup-java@v4
          with:
            java-version: 17
            distribution: temurin

        - name: Generate debug signing key
          run: |
            keytool -genkeypair -v \
              -keystore signingkey.jks \
              -alias key0 \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=AllAnime, OU=Extensions, O=AllAnime, L=Unknown, ST=Unknown, C=US"
            echo "KEY_STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "ALIAS=key0" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV

        - name: Set up Gradle
          uses: gradle/actions/setup-gradle@v4

        - name: Build AllAnime APK
          run: ./gradlew :src:en:allanime:assembleRelease -x spotlessCheck

        - name: Upload APK
          uses: actions/upload-artifact@v4
          with:
            name: AllAnime-APK
            path: src/en/allanime/build/outputs/apk/release/*.apk
            if-no-files-found: error
    