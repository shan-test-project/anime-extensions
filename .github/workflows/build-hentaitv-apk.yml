name: Build HentaiTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/en/hentaitv/**"
      - ".github/workflows/build-hentaitv-apk.yml"
      - "gradle/build-logic/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

jobs:
  build:
    name: Build HentaiTV release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Pre-build Spotless (format HentaiTV)
        run: ./gradlew :src:en:hentaitv:spotlessApply

      - name: Show Spotless changes
        run: git --no-pager diff --stat -- src/en/hentaitv

      - name: Verify Spotless formatting
        run: ./gradlew :src:en:hentaitv:spotlessCheck

      - name: Build HentaiTV
        run: ./gradlew :src:en:hentaitv:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hentaitv-release-apk
          path: src/en/hentaitv/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
